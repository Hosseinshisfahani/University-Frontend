name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_PUBLIC_UNIVERSITY_HOST: ${{ vars.UNIVERSITY_HOST }}
          NEXT_PUBLIC_PSY_HOST: ${{ vars.PSY_HOST }}
          NEXT_PUBLIC_PSY_ORIGIN: ${{ vars.PSY_ORIGIN }}

  image:
    name: Push GHCR image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/hosseinshisfahani/university-frontend:${{ github.sha }}
            ghcr.io/hosseinshisfahani/university-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_UNIVERSITY_HOST=${{ vars.UNIVERSITY_HOST }}
            NEXT_PUBLIC_PSY_HOST=${{ vars.PSY_HOST }}
            NEXT_PUBLIC_PSY_ORIGIN=${{ vars.PSY_ORIGIN }}